<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="50%" stop-color="#ff5252" />
      <stop offset="100%" stop-color="#ff1744" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#ff8a80" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff1744" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: 3px;
    }
    .subtitle {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-weight: 600;
      font-size: 21px;
      letter-spacing: 2px;
      fill: #ff3355;
    }
    .tag {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .border-glow {
      stroke: #ff1744;
      stroke-opacity: 0.35;
      stroke-width: 1.5;
    }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Top glow line -->
  <line x1="100" y1="0" x2="1100" y2="0" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
  <line x1="100" y1="0" x2="1100" y2="0" stroke="#ff5252" stroke-width="1.5" />

  <!-- Decorative Cyber Corner Accents -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" class="border-glow" stroke-width="2" />
  <path d="M 1170 60 L 1170 30 L 1140 30" fill="none" class="border-glow" stroke-width="2" />
  <path d="M 30 220 L 30 250 L 60 250" fill="none" class="border-glow" stroke-width="2" />
  <path d="M 1170 220 L 1170 250 L 1140 250" fill="none" class="border-glow" stroke-width="2" />

  <!-- Left Circuit Nodes -->
  <circle cx="200" cy="80" r="3" fill="#ff1744" opacity="0.6" />
  <line x1="200" y1="80" x2="260" y2="80" stroke="#ff1744" stroke-width="1" opacity="0.25" />
  <circle cx="260" cy="80" r="2" fill="#ff1744" opacity="0.4" />

  <!-- Right Circuit Nodes -->
  <circle cx="1000" cy="200" r="3" fill="#ff1744" opacity="0.6" />
  <line x1="940" y1="200" x2="1000" y2="200" stroke="#ff1744" stroke-width="1" opacity="0.25" />
  <circle cx="940" cy="200" r="2" fill="#ff1744" opacity="0.4" />

  <!-- Status indicator -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <circle cx="-130" cy="-14" r="4" fill="#00e676" filter="url(#subtleGlow)" />
    <text x="-115" y="-10" class="tag" fill="#00e676" font-size="12" text-anchor="start">SYSTEM // SEC_OPS ACTIVE</text>
  </g>

  <!-- Title Text -->
  <text x="600" y="125" text-anchor="middle" class="title" fill="url(#textGrad)" filter="url(#subtleGlow)">
    SOMESHWAR S
  </text>

  <!-- Subtitle -->
  <text x="600" y="168" text-anchor="middle" class="subtitle">
    &lt; SOC ANALYST &amp; DETECTION ENGINEER /&gt;
  </text>

  <!-- Tech Tags in Banner -->
  <g transform="translate(600, 215)" text-anchor="middle">
    <rect x="-380" y="-16" width="170" height="28" rx="14" fill="#161e2e" stroke="#ff1744" stroke-opacity="0.25" stroke-width="1" />
    <text x="-295" y="3" class="tag" text-anchor="middle">🛡️ Detection Engineering</text>

    <rect x="-190" y="-16" width="170" height="28" rx="14" fill="#161e2e" stroke="#ff1744" stroke-opacity="0.25" stroke-width="1" />
    <text x="-105" y="3" class="tag" text-anchor="middle">⚡ Security Operations</text>

    <rect x="0" y="-16" width="180" height="28" rx="14" fill="#161e2e" stroke="#ff1744" stroke-opacity="0.25" stroke-width="1" />
    <text x="90" y="3" class="tag" text-anchor="middle">🔍 Endpoint Telemetry</text>

    <rect x="200" y="-16" width="180" height="28" rx="14" fill="#161e2e" stroke="#ff1744" stroke-opacity="0.25" stroke-width="1" />
    <text x="290" y="3" class="tag" text-anchor="middle">🚨 Incident Response</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="200" y1="279" x2="1000" y2="279" stroke="url(#accentGrad)" stroke-width="2" />
</svg>
